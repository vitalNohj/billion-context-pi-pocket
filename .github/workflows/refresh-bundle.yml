name: Refresh pins

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions: {}

# Keep builds and direct-to-main writes serial. Do not cancel a run after it starts.
concurrency:
  group: refresh-bundle
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      npm_config_ignore_scripts: "true"
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_jobs: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      MAKEFLAGS: "-j2"
      UV_THREADPOOL_SIZE: "2"
    outputs:
      version: ${{ steps.refresh.outputs.version }}
      needs_update: ${{ steps.refresh.outputs.needs_update }}
      tested_sha: ${{ steps.tested_base.outputs.sha }}
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Record the tested main commit
        id: tested_base
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse --verify HEAD)"
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$TESTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'PI_POCKET_CHECKOUT=%s/pi-pocket\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Check out Pi Pocket outside the extension repository
        shell: bash
        run: |
          set -euo pipefail
          CPU_SET="$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')"
          git init --quiet "$PI_POCKET_CHECKOUT"
          git -C "$PI_POCKET_CHECKOUT" remote add origin https://github.com/TannerMidd/pi-pocket.git
          taskset -c "$CPU_SET" git -C "$PI_POCKET_CHECKOUT" fetch --quiet --depth=1 origin 50194aa38eb368ef2cb8599d44fba81b05ed5263
          git -C "$PI_POCKET_CHECKOUT" checkout --quiet --detach FETCH_HEAD

      - name: Verify the pinned Pi Pocket revision
        working-directory: ${{ runner.temp }}/pi-pocket
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "50194aa38eb368ef2cb8599d44fba81b05ed5263"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (pkg.name !== "pi-pocket" || pkg.version !== "0.27.0") {
            throw new Error(`Expected pi-pocket@0.27.0, found ${pkg.name}@${pkg.version}`);
          }
          NODE
          test -f test/helpers.ts

      - name: Install Pi Pocket dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          CPU_SET="$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')"
          test -n "$CPU_SET"
          taskset -c "$CPU_SET" npm ci --ignore-scripts --no-audit --no-fund --prefix "$PI_POCKET_CHECKOUT"

      - name: Check npm and test the refreshed pins
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          CPU_SET="$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')"
          test -n "$CPU_SET"

          taskset -c "$CPU_SET" npm ci --ignore-scripts --no-audit --no-fund
          taskset -c "$CPU_SET" npm run check-upstream

          # Accept only the 2 expected, single-line outputs. This blocks malformed npm
          # metadata from becoming shell input or extra workflow outputs.
          VALIDATED="$(node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const file = process.env.GITHUB_OUTPUT;
          const lines = readFileSync(file, "utf8").split(/\r?\n/);
          if (lines.at(-1) === "") lines.pop();
          if (lines.length !== 2) throw new Error("check-upstream must write exactly 2 output lines");
          const values = new Map();
          for (const line of lines) {
            const match = /^(version|needs_update)=(.*)$/.exec(line);
            if (!match || values.has(match[1])) throw new Error("Invalid check-upstream output");
            values.set(match[1], match[2]);
          }
          const version = values.get("version");
          const needsUpdate = values.get("needs_update");
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (!semver.test(version ?? "")) throw new Error("check-upstream returned an invalid SemVer version");
          if (needsUpdate !== "true" && needsUpdate !== "false") {
            throw new Error("check-upstream needs_update must be true or false");
          }
          writeFileSync(file, `version=${version}\nneeds_update=${needsUpdate}\n`, "utf8");
          process.stdout.write(`${version}\t${needsUpdate}`);
          NODE
          )"
          IFS=$'\t' read -r UPSTREAM_VERSION NEEDS_UPDATE <<< "$VALIDATED"
          printf 'Checked upstream version %s (needs_update=%s).\n' "$UPSTREAM_VERSION" "$NEEDS_UPDATE"

          if [ "$NEEDS_UPDATE" = "true" ]; then
            taskset -c "$CPU_SET" npm run refresh -- "$UPSTREAM_VERSION"
            taskset -c "$CPU_SET" npm ci --ignore-scripts --no-audit --no-fund
          fi

          test -f "$PI_POCKET_CHECKOUT/test/helpers.ts"
          test -f "$PI_POCKET_CHECKOUT/node_modules/@earendil-works/pi-ai/dist/providers/faux.js"
          taskset -c "$CPU_SET" npm test
          taskset -c "$CPU_SET" npm run verify-pins

          if [ "$NEEDS_UPDATE" = "true" ]; then
            git add -- package.json package-lock.json upstream.json billion-context-pi-pocket/runtime-lock.json billion-context-pi-pocket/tool-contract.json billion-context-pi-pocket/BCP-LICENSE.txt billion-context-pi-pocket/THIRD-PARTY-NOTICES.txt
            if git diff --cached --quiet; then
              echo "Refresh reported an update but produced no tracked changes." >&2
              exit 1
            fi
            git diff --cached --binary --full-index --no-ext-diff > "$RUNNER_TEMP/refresh.patch"
            test -s "$RUNNER_TEMP/refresh.patch"
          fi

      - name: Upload the tested refresh patch
        if: ${{ steps.refresh.outputs.needs_update == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-patch
          path: ${{ runner.temp }}/refresh.patch
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  platform:
    name: Native installer (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-latest, windows-latest]
    env:
      UV_THREADPOOL_SIZE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tested_sha }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Download the candidate pin update
        if: ${{ needs.build.outputs.needs_update == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: refresh-patch
          path: ${{ runner.temp }}/refresh-artifact

      - name: Apply the same candidate tested on Linux
        if: ${{ needs.build.outputs.needs_update == 'true' }}
        run: |
          set -euo pipefail
          PATCH_FILE="$RUNNER_TEMP/refresh-artifact/refresh.patch"
          git apply --check --index "$PATCH_FILE"
          git apply --index "$PATCH_FILE"

      - name: Verify native install, provided packages, and uninstall
        run: node --test --test-concurrency=1 test/platform-smoke.test.mjs

  publish:
    if: ${{ github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.platform.result == 'success' && needs.build.outputs.needs_update == 'true' }}
    needs: [build, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tested_sha }}

      - name: Download the tested patch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: refresh-patch
          path: ${{ runner.temp }}/refresh-artifact

      - name: Apply, validate, and commit the tested pins
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ needs.build.outputs.version }}
          TESTED_SHA: ${{ needs.build.outputs.tested_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The build did not provide a valid tested commit SHA." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "Publish checkout does not match the tested commit." >&2
            exit 1
          fi
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$REMOTE_SHA" != "$TESTED_SHA" ]; then
            echo "main changed after the build. Stop; the next scheduled run can retest it." >&2
            exit 1
          fi

          PATCH_FILE="$RUNNER_TEMP/refresh-artifact/refresh.patch"
          test -s "$PATCH_FILE"
          git apply --check --index "$PATCH_FILE"
          git apply --index "$PATCH_FILE"
          # Keep copied upstream files byte-for-byte, even if their whitespace changes.
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The tested patch contains no changes." >&2
            exit 1
          fi

          # Validate the tested patch without executing repository code in this write-enabled job.
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import { isDeepStrictEqual } from "node:util";
          const fields = execFileSync("git", ["diff", "--cached", "--raw", "-z", "--no-renames"], { encoding: "utf8" }).split("\0");
          if (fields.pop() !== "" || !fields.length || fields.length % 2) throw new Error("Invalid staged diff");
          const allowed = new Set(["package.json", "package-lock.json", "upstream.json", "billion-context-pi-pocket/runtime-lock.json", "billion-context-pi-pocket/tool-contract.json", "billion-context-pi-pocket/BCP-LICENSE.txt", "billion-context-pi-pocket/THIRD-PARTY-NOTICES.txt"]);
          for (let i = 0; i < fields.length; i += 2) {
            const match = /^:([0-7]{6}) ([0-7]{6}) [a-f0-9]+ [a-f0-9]+ ([AM])$/.exec(fields[i]);
            if (!allowed.has(fields[i + 1]) || !match || !["000000", "100644"].includes(match[1]) || match[2] !== "100644") throw new Error(`Unexpected staged path or mode: ${fields[i + 1]}`);
          }
          const previous = JSON.parse(execFileSync("git", ["show", "HEAD:package.json"], { encoding: "utf8" }));
          const current = JSON.parse(readFileSync("package.json", "utf8"));
          const upstream = JSON.parse(readFileSync("upstream.json", "utf8"));
          const lock = JSON.parse(readFileSync("billion-context-pi-pocket/runtime-lock.json", "utf8"));
          const oldLock = JSON.parse(execFileSync("git", ["show", "HEAD:billion-context-pi-pocket/runtime-lock.json"], { encoding: "utf8" }));
          const contract = JSON.parse(readFileSync("billion-context-pi-pocket/tool-contract.json", "utf8"));
          const version = process.env.UPSTREAM_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || current.version !== version || upstream.version !== version || current.devDependencies["billion-context-pi"] !== version || lock.current !== version || contract.version !== version || lock.format !== 1 || lock.package !== "billion-context-pi" || contract.format !== 1 || contract.package !== "billion-context-pi") throw new Error("Version or format mismatch");
          for (const key of new Set([...Object.keys(previous), ...Object.keys(current)])) if (!["version", "devDependencies"].includes(key) && !isDeepStrictEqual(previous[key], current[key])) throw new Error(`Unexpected package field: ${key}`);
          const oldUpstream = JSON.parse(execFileSync("git", ["show", "HEAD:upstream.json"], { encoding: "utf8" }));
          const allowedDeps = new Set(["billion-context-pi", ...Object.keys(oldUpstream.bundledDependencies), ...Object.keys(upstream.bundledDependencies)]);
          for (const name of new Set([...Object.keys(previous.devDependencies), ...Object.keys(current.devDependencies)])) if (!allowedDeps.has(name) && !isDeepStrictEqual(previous.devDependencies[name], current.devDependencies[name])) throw new Error(`Unexpected dependency change: ${name}`);
          for (const [name, entry] of Object.entries(upstream.bundledDependencies)) if (current.devDependencies[name] !== entry.version) throw new Error(`Dependency mismatch: ${name}`);
          if (!Array.isArray(lock.releases) || !Array.isArray(oldLock.releases) || oldLock.releases.some((p) => !lock.releases.some((q) => isDeepStrictEqual(p, q))) || new Set(lock.releases.map((p) => p.version)).size !== lock.releases.length) throw new Error("Reviewed pins changed or disappeared");
          const pin = lock.releases.find((p) => p.version === version);
          if (!pin || pin.integrity !== upstream.npmIntegrity || pin.tarball !== `https://registry.npmjs.org/billion-context-pi/-/billion-context-pi-${version}.tgz`) throw new Error("Current pin mismatch");
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh billion-context-pi pins to $UPSTREAM_VERSION"
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$REMOTE_SHA" != "$TESTED_SHA" ]; then
            echo "main changed before publish. Stop; the next scheduled run can retest it." >&2
            exit 1
          fi
          git push origin HEAD:refs/heads/main

  report-failure:
    if: ${{ always() && (needs.build.result == 'failure' || needs.platform.result == 'failure' || needs.publish.result == 'failure') && github.ref == 'refs/heads/main' }}
    needs: [build, platform, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the refresh failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Automated pin refresh failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            | jq -rs --arg title "$ISSUE_TITLE" '[.[][] | select(.title == $title and .pull_request == null) | .number] | first // empty')"
          ISSUE_BODY="The automated pin refresh failed. Review the run: ${RUN_URL}"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --field "body=${ISSUE_BODY}" >/dev/null
            printf 'Updated refresh failure issue #%s.\n' "$ISSUE_NUMBER"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
              --field "title=${ISSUE_TITLE}" --field "body=${ISSUE_BODY}" >/dev/null
            echo "Opened the refresh failure issue."
          fi
